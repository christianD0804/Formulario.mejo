<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULARIO</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f2f2f2; text-align: center; }
        .caja { display: inline-block; vertical-align: top; width: 420px; max-width: 90%; background: #fff;
                border: 1px solid #ccc; border-radius: 10px; padding: 20px; margin: 10px; }
        input, textarea { width: 90%; padding: 10px; margin: 5px 0 15px; border: 1px solid #ccc; border-radius: 6px; text-align: center; }
        button { width: 90%; padding: 12px; background: #25d366; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        iframe { width: 100%; height: 400px; border: 0; }
        small { display: block; margin-top: -12px; margin-bottom: 15px; color: #666; }
    </style>
</head>
<body>
    <h1>FORMULARIO</h1>
    <p>SERIAS TAN AMABLE DE RELLENAR ESTE FORMULARIO</p>

    <form class="caja" id="formulario">
        <h3>INGRESE SU NOMBRE COMPLETO</h3>
        <input id="nombre" type="text" placeholder="INGRESE AQUI SU NOMBRE COMPLETO DE FAVOR" minlength="3" maxlength="50"
               pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+" title="Solo letras, de 3 a 50" required>

        <h3>INGRESE SU NUMERO DE TEL</h3>
        <input id="telefono" type="tel" placeholder="INGRESE AQUI SU TEL" maxlength="10" inputmode="numeric"
               pattern="[0-9]{10}" title="Exactamente 10 números" required>

        <h3>INGRESE SU CORREO DE GMAIL</h3>
        <input id="correo" type="email" placeholder="SERIA TAN AMABLE DE PROPORCIONAR SU CORREO " maxlength="50"
               pattern=".+@gmail\.com" title="Debe ser un correo @gmail.com" required>

        <h3>DA UN COMENTARIO</h3>
        <textarea id="comentario" placeholder="HAS UN COMENTARIO POR QUEI DE FAVOR" maxlength="200" required></textarea>
        <small id="contador">TIENES CHANCE DE 30 PALABRAS PARA OPINAR DE ALGO </small>

        <h3>CAPTCHA: DIME CUANTO ES  <span id="pregunta"></span>?</h3>
        <input id="respuesta" type="number" placeholder="resultado" required>

        <button type="submit">ENVIAR AL WATTS</button>
    </form>

    <div class="caja">
        <h3>UBICACIÓN</h3>
        <iframe src="https://maps.google.com/maps?q=UATV%20Tulcingo%20de%20Valle%2C%20Puebla&z=16&output=embed"></iframe>
    </div>

    <script>
        let a = Math.floor(Math.random() * 10) + 1;
        let b = Math.floor(Math.random() * 10) + 1;
        document.getElementById("pregunta").textContent = a + " + " + b;

        let comentario = document.getElementById("comentario");
        comentario.oninput = function () {
            let palabras = comentario.value.trim().split(/\s+/).filter(p => p !== "");
            if (palabras.length > 30) {
                comentario.value = palabras.slice(0, 30).join(" ");
                palabras = palabras.slice(0, 30);
            }
            document.getElementById("contador").textContent = (30 - palabras.length) + " palabras restantes";
        };

        document.getElementById("formulario").onsubmit = function (e) {
            e.preventDefault();

            if (Number(document.getElementById("INGRESA AQUI SEGUN TUS CONOCIMIENTOS EL RESULTADO ").value) !== a + b) {
                alert("Captcha incorrecto");
                return;
            }

            let texto = "Nombre: " + document.getElementById("nombre").value +
                        "\nTeléfono: " + document.getElementById("telefono").value +
                        "\nCorreo: " + document.getElementById("correo").value +
                        "\nComentario: " + comentario.value;

            window.open("https://wa.me/527571337825?text=" + encodeURIComponent(texto));
        };
    </script>
</body>
</html>
